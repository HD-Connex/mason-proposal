function getTimeline(bundleSelected, selectedPackages, selectedAddons) {
  if (bundleSelected) return `6–8 weeks${selectedAddons.length > 0 ? " (add-ons run in parallel during final phase)" : ""}`;
  if (selectedPackages.length === 0) return "Select at least one package";
  const maxMin = Math.max(...selectedPackages.map(p => p.weeksMin));
  const maxMax = Math.max(...selectedPackages.map(p => p.weeksMax));
  const extra = selectedAddons.length > 0 ? 1 : 0;
  return `${maxMin}–${maxMax + extra} weeks`;
}

function ContractTimeline({ bundleSelected, selectedPackages, selectedAddons }) {
  const phases = [];
  if (bundleSelected) {
    phases.push({ label: "Weeks 1–2", task: "FFL credential review, full system architecture, all three module configurations begin simultaneously" });
    phases.push({ label: "Weeks 3–4", task: "Compliance Core live: NICS integration, 4473 e-sig, bound book, FL rules engine, straw flag alerts" });
    phases.push({ label: "Weeks 4–5", task: "Pawn Operations live: contract templates, SMS automation, loan dashboard, police hold reporting" });
    phases.push({ label: "Weeks 5–6", task: "Marketplace live: GunBroker + all channel feeds, AI descriptions, compliance-gated publishing, auto-delist tested" });
    phases.push({ label: "Weeks 7–8", task: "Cross-suite integrations, dual-run period (digital + manual), staff training all modules, ATF readiness audit, full go-live" });
    if (selectedAddons.length > 0) phases.push({ label: "Parallel (Wks 5–8)", task: `Add-on deployment: ${selectedAddons.map(a => a.name).join(", ")}`, isAddon: true });
  } else {
    selectedPackages.forEach(pkg => pkg.phases.forEach(ph => phases.push({ label: ph.label, task: ph.task, pkgName: pkg.name, accent: pkg.accent })));
    if (selectedAddons.length > 0) phases.push({ label: "Parallel (final week)", task: `Add-on deployment: ${selectedAddons.map(a => a.name).join(", ")}`, isAddon: true });
    phases.push({ label: "Final 2 weeks", task: "Dual-run period (manual + digital), staff validation, full go-live clearance" });
  }
  return (
    <div>
      {phases.map((ph, i) => (
        <div key={i} style={{ display: "flex", gap: 0, marginBottom: 12 }}>
          <div style={{ width: 150, flexShrink: 0, fontSize: 11.5, fontWeight: 700, color: ph.isAddon ? "#A78BFA" : "#F97316", paddingTop: 1, paddingRight: 16 }}>{ph.label}</div>

}

function InvestmentTable({ bundleSelected, selectedPackages, selectedAddons, totalOneTime, totalMonthly }) {
  const rows = [{ label: "Mason Avenue Gun & Pawn — Business Website (completed)", sub: "Includes hosting, SSL, content updates, security monitoring", oneTime: WEBSITE.oneTime, monthly: WEBSITE.monthly }];

function PaymentTermsSection({ totalOneTime, totalMonthly, bundleSelected }) {
  const deposit = Math.round(totalOneTime * 0.5);

      <div style={{ marginBottom: 16 }}>
        <strong style={{ color: "#1A1A2E" }}>One-Time Setup Fee — {fmt(totalOneTime)} total:</strong>

      </div>
      <div style={{ marginBottom: 16 }}>
        <strong style={{ color: "#1A1A2E" }}>Monthly Recurring — {fmt(totalMonthly)}/month:</strong>
        <div style={{ paddingLeft: 16, marginTop: 4 }}><div>· First month billed on go-live date. Subsequent billing on same day each month.</div><div>· All-inclusive: hosting, cloud storage, API access, SMS/email, AI tokens, and maintenance.</div><div>· 30 days written notice required to cancel.</div></div>

}

function SigBlock({ label, title, sigData, onChange, labelColor }) {
  return (
    <div>
      <div style={{ borderBottom: "2px solid #2A2A3A", marginBottom: 8, height: 52 }}>
        <input type="text" value={sigData} onChange={e => onChange(e.target.value)} placeholder="Type full legal name" style={{ width: "100%", height: 50, border: "none", background: "transparent", fontSize: 20, fontFamily: "'Georgia', serif", fontStyle: "italic", color: "#1A1A2E", outline: "none" }} />
      </div>
      <div style={{ fontSize: 13, fontWeight: 700, color: labelColor || "#333333" }}>{label}</div>
      <div style={{ fontSize: 12, color: "#666666" }}>{title}</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginTop: 22 }}>
        {[["Printed Name", "Date"],["Title / Role", ""]].map((row, ri) => row.map((lbl, ci) => lbl ? <div key={ri + "-" + ci}><div style={{ borderBottom: "1px solid #CCCCCC", height: 36, marginBottom: 5 }}></div><div style={{ fontSize: 10.5, color: "#666666" }}>{lbl}</div></div> : <div key={ri + "-" + ci} />))}
      </div>
    </div>
  );
}

function Contract({ bundleSelected, pkgs, addons, totalOneTime, totalMonthly, onBack }) {

Provider: ${providerSig || "[unsigned]"}
Client: ${clientSig || "[unsigned]"}

---
This message was generated from the HD Connex Proposal System.
Agreement ${contractNum} | ${TODAY}

          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 10, color: "#666666", letterSpacing: "0.14em", fontFamily: "monospace" }}>SERVICE AGREEMENT</div>

            <div style={{ fontSize: 11.5, color: "#666666", marginTop: 4 }}>Issued: {TODAY}</div>
          </div>
        </div>

          <div style={{ background: "#F9F8F5", padding: "18px 20px", borderRadius: 6 }}>
            <div style={{ fontSize: 9.5, color: "#F97316", letterSpacing: "0.14em", marginBottom: 8, fontFamily: "monospace", fontWeight: 700 }}>SERVICE PROVIDER</div>
            <div style={{ fontWeight: 700, fontSize: 15, color: "#333333" }}>HD Connex</div>

          </div>
          <div style={{ background: "#F9F8F5", padding: "18px 20px", borderRadius: 6 }}>
            <div style={{ fontSize: 9.5, color: "#22D3EE", letterSpacing: "0.14em", marginBottom: 8, fontFamily: "monospace", fontWeight: 700 }}>CLIENT</div>
            <div style={{ fontWeight: 700, fontSize: 15, color: "#333333" }}>Mason Avenue Gun & Pawn</div>
            <div style={{ fontSize: 12, color: "#666666", marginTop: 5, lineHeight: 1.7 }}>Daytona Beach, Florida<br />Federal Firearms Licensee (FFL)<br />Licensed Pawnbroker — Volusia County, FL</div>
          </div>
        </div>

        <div style={{ padding: "18px 22px", borderLeft: "4px solid #F97316", background: "#FFF9F4", marginBottom: 36, borderRadius: "0 6px 6px 0" }}>
          <p style={{ fontSize: 13, color: "#333333", lineHeight: 1.75, margin: 0 }}>This Service Agreement is entered into as of <strong>{TODAY}</strong> between HD Connex and Mason Avenue Gun & Pawn.</p>
        </div>

        <div style={{ marginBottom: 36 }}>

            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: "#333333", marginBottom: 6 }}>Mason Avenue Gun & Pawn — Business Website</div>
              <p style={{ fontSize: 12.5, color: "#333333", lineHeight: 1.7, margin: "0 0 10px" }}>Professional business website — fully designed, developed, and delivered. Status: <strong style={{ color: "#27AE60" }}>COMPLETE & LIVE</strong>.</p>
            </div>
            <div style={{ textAlign: "right", flexShrink: 0, minWidth: 110 }}>
              <div style={{ fontSize: 19, fontWeight: 700, color: "#F97316" }}>{fmt(WEBSITE.oneTime)}</div>
              <div style={{ fontSize: 11, color: "#666666" }}>one-time</div>

        <div style={{ marginBottom: 36 }}>

          {bundleSelected && <div style={{ padding: "10px 16px", background: "#F0FFF8", border: "1px solid #27AE60", borderRadius: 6, marginBottom: 20, fontSize: 12.5, color: "#1A4A2A", fontWeight: 600 }}>★ Full Platform Bundle selected — all three automation suites at bundle pricing.</div>}
          {selectedPackages.map((pkg, i) => <PackageContractSection key={pkg.id} pkg={pkg} num={i + 1} />)}

        <div style={{ marginBottom: 36 }}>
          <SectionHeader>SECTION 3 — IMPLEMENTATION TIMELINE</SectionHeader>

        <div style={{ marginBottom: 36 }}>

            <div style={{ fontSize: 11, color: "#333333", fontWeight: 600 }}>✓ Monthly fees are all-inclusive. No surprise bills.</div>

        <div style={{ marginBottom: 36 }}>
          <SectionHeader>SECTION 5 — PAYMENT TERMS & CONDITIONS</SectionHeader>
          <PaymentTermsSection totalOneTime={totalOneTime} totalMonthly={totalMonthly} bundleSelected={bundleSelected} />
        </div>

        <div style={{ marginBottom: 48 }}>
          <SectionHeader>SECTION 6 — AUTHORIZATION & SIGNATURES</SectionHeader>
          <p style={{ fontSize: 12.5, color: "#5A5A72", marginBottom: 28, lineHeight: 1.7 }}>By signing below, both parties acknowledge that they have read, understood, and agree to the full scope of services outlined in this Agreement.</p>

            <SigBlock label="HD Connex" title="Service Provider" sigData={providerSig} onChange={setProviderSig} labelColor="#333333" />
            <SigBlock label="Mason Avenue Gun & Pawn" title="Client" sigData={clientSig} onChange={setClientSig} labelColor="#333333" />
          </div>
          <div style={{ marginTop: 20, padding: "14px 20px", background: "#F0FFF8", border: "1px solid #B8E8C8", borderRadius: 6 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", fontSize: 13, color: "#333333" }}>
              <input type="checkbox" checked={esign} onChange={e => setEsign(e.target.checked)} style={{ width: 18, height: 18, accentColor: "#27AE60" }} />

            </label>
          </div>
          <div style={{ marginTop: 32, padding: "20px", background: "#F9F8F5", borderRadius: 8, textAlign: "center" }}>

              <button onClick={handleSignAndSend} style={{ background: "#F97316", border: "none", color: "#fff", padding: "16px 40px", borderRadius: 6, cursor: "pointer", fontWeight: 800, fontSize: 15, fontFamily: "monospace" }}>

function App() {
  const [view, setView] = useState("form");
  const [bundleSelected, setBundleSelected] = useState(false);
  const [pkgs, setPkgs] = useState(new Set());
  const [addons, setAddons] = useState(new Set());

  const togglePkg = id => { if (bundleSelected) return; setPkgs(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }); };
  const toggleAddon = id => { setAddons(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }); };
  const toggleBundle = () => { setBundleSelected(v => { if (!v) setPkgs(new Set()); return !v; }); };

  const { totalOneTime, totalMonthly } = useMemo(() => {
    let ot = WEBSITE.oneTime, mo = WEBSITE.monthly;
    if (bundleSelected) { ot += BUNDLE.oneTime; mo += BUNDLE.monthly; }
    else PACKAGES.forEach(p => { if (pkgs.has(p.id)) { ot += p.oneTime; mo += p.monthly; } });
    ADDONS.forEach(a => { if (addons.has(a.id)) { ot += a.oneTime; mo += a.monthly; } });
    return { totalOneTime: ot, totalMonthly: mo };
  }, [bundleSelected, pkgs, addons]);

  const hasSelections = true;

  if (view === "contract") {
    return <Contract bundleSelected={bundleSelected} pkgs={pkgs} addons={addons} totalOneTime={totalOneTime} totalMonthly={totalMonthly} onBack={() => setView("form")} />;
  }

  return (
    <div style={{ minHeight: "100vh", background: "#0A0A0F", color: "#F0F0F8", fontFamily: "'Georgia', serif" }}>
      <div style={{ background: "linear-gradient(135deg, #0E0E1A 0%, #180E0A 100%)", borderBottom: "1px solid #2A2A3A", padding: "20px 28px", position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ maxWidth: 1120, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
          <div>
            <HDLogo dark={true} />
            <div style={{ fontSize: 12, color: "#8080A0", marginTop: 4 }}>Automation Proposal Builder — Mason Avenue Gun & Pawn</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 10.5, color: "#8080A0", letterSpacing: "0.1em", fontFamily: "monospace" }}>RUNNING TOTAL</div>
            <div style={{ fontSize: 26, fontWeight: 700, color: "#F97316" }}>{fmt(totalOneTime)}</div>
            <div style={{ fontSize: 13, color: "#22D3EE" }}>+ {fmt(totalMonthly)}/mo</div>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1120, margin: "0 auto", padding: "32px 28px 130px" }}>
        <div style={{ background: "#16161E", border: "1px solid #2A2A3A", borderRadius: 8, padding: "16px 22px", marginBottom: 36, display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 16 }}>
          <div>
            <div style={{ fontSize: 10, color: "#F97316", letterSpacing: "0.12em", fontFamily: "monospace", marginBottom: 5, fontWeight: 700 }}>ALWAYS INCLUDED — NO TOGGLE NEEDED</div>
            <div style={{ fontWeight: 600, fontSize: 15 }}>Business Website — Mason Avenue Gun & Pawn</div>
            <div style={{ fontSize: 12.5, color: "#8080A0", marginTop: 3 }}>Already completed and live.</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ color: "#F97316", fontWeight: 700, fontSize: 16 }}>{fmt(WEBSITE.oneTime)} <span style={{ fontSize: 12, color: "#8080A0" }}>one-time</span></div>
            <div style={{ color: "#22D3EE", fontSize: 13, marginTop: 3 }}>{fmt(WEBSITE.monthly)}/mo maintenance</div>
          </div>
        </div>

        <div style={{ marginBottom: 40 }}>
          <SectionLabel>▸ RECOMMENDED — FULL PLATFORM BUNDLE</SectionLabel>
          <BundleCard selected={bundleSelected} onToggle={toggleBundle} />
        </div>

        <div style={{ marginBottom: 40 }}>
          <SectionLabel>▸ INDIVIDUAL PACKAGES</SectionLabel>
          {bundleSelected && <div style={{ padding: "10px 16px", background: "rgba(249,115,22,0.06)", border: "1px solid rgba(249,115,22,0.2)", borderRadius: 6, marginBottom: 14, fontSize: 12.5, color: "#F97316" }}>Bundle selected — individual packages are included.</div>}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(310px, 1fr))", gap: 16 }}>
            {PACKAGES.map(p => <PackageCard key={p.id} pkg={p} selected={pkgs.has(p.id) || bundleSelected} disabled={bundleSelected} onToggle={() => togglePkg(p.id)} />)}
          </div>
        </div>

        <div style={{ marginBottom: 40 }}>
          <SectionLabel>▸ ADD-ON SERVICES</SectionLabel>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 12 }}>
            {ADDONS.map(a => <AddonCard key={a.id} addon={a} selected={addons.has(a.id)} onToggle={() => toggleAddon(a.id)} />)}
          </div>
        </div>
      </div>

      <div data-print-hide style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "rgba(17,17,24,0.97)", borderTop: "1px solid #2A2A3A", padding: "14px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 16 }}>
        <div style={{ display: "flex", gap: 36, flexWrap: "wrap" }}>
          <div><div style={{ fontSize: 9.5, color: "#8080A0", letterSpacing: "0.1em", fontFamily: "monospace" }}>ONE-TIME INVESTMENT</div><div style={{ fontSize: 26, fontWeight: 700, color: "#F97316" }}>{fmt(totalOneTime)}</div></div>
          <div><div style={{ fontSize: 9.5, color: "#8080A0", letterSpacing: "0.1em", fontFamily: "monospace" }}>MONTHLY RECURRING</div><div style={{ fontSize: 26, fontWeight: 700, color: "#22D3EE" }}>{fmt(totalMonthly)}/mo</div></div>
        </div>
        <button onClick={() => hasSelections && setView("contract")} disabled={!hasSelections} style={{ background: hasSelections ? "#F97316" : "#2A2A3A", color: hasSelections ? "#0A0A0F" : "#6060A0", border: "none", padding: "14px 36px", borderRadius: 6, fontWeight: 800, fontSize: 14, cursor: hasSelections ? "pointer" : "not-allowed", fontFamily: "monospace" }}>GENERATE CONTRACT →</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
